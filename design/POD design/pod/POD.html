<head>

  <title>POD · Panel Operativo de Desarrollo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
            mono: ['"IBM Plex Mono"', "ui-monospace", "monospace"],
          },
          colors: { zinc: { 150: "#ebebee" } },
        },
      },
    };
  </script>

  <style>
    html { font-family: "IBM Plex Sans", system-ui, sans-serif; }
    body { margin: 0; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    ::selection { background: rgba(16, 185, 129, 0.22); }
    /* Scrollbar discreto */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(113, 113, 122, 0.28); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(113, 113, 122, 0.45); background-clip: content-box; }
    ::-webkit-scrollbar-track { background: transparent; }
    input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }
  </style>
</head>
