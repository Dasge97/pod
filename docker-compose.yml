services:
  db:
    image: mysql:8.0
    container_name: pod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pod
      MYSQL_USER: pod
      MYSQL_PASSWORD: pod
    ports:
      - "3306:3306"
    volumes:
      - pod_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: pod-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:8080"

volumes:
  pod_db_data:
